<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/fontawesome-all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
    <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <title th:text="${titulo} ? ${titulo} : 'Blog Telecom'">Blog Telecom</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-md fixed-top" th:fragment="navbar">
    <a class="navbar-brand" th:href="@{/post}">Blog Telecom</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/post}">Listar posts</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
                <a class="nav-link" th:href="@{/post/create}">Crear post</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
                <a class="nav-link" th:href="@{/user}">Ver mi perfil</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
                <a class="nav-link" th:href="@{/amigos}">Amigos</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin'}">
                <a class="nav-link" th:href="@{/user/list}">Listar usuarios</a>
            </li>
        </ul>
        <div th:if="${session.usuario == null}">
            <a th:href="@{/loginForm}" class="btn btn-info">Iniciar sesión</a>
        </div>
        <div th:if="${session.usuario != null}" class="d-flex align-items-center">
            <span class="text-light mr-3">
                <span th:text="|${session.usuario.firstname} ${session.usuario.lastname}|">Nombre</span>
                <span class="badge badge-secondary" th:text="${session.rol}">rol</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-info">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success" role="alert"></div>
    <div th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></div>
    <div th:if="${param.denegado}" class="alert alert-danger" role="alert">No tienes permisos para acceder a esa página</div>
</div>
</body>
</html>

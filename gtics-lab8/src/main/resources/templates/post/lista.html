<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Lista de posts')"></head>
<body>
<nav th:replace="base :: navbar"></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Lista de posts</h3>
        <a th:if="${session.usuario != null}" th:href="@{/post/create}" class="btn btn-success">Nuevo post</a>
    </div>

    <div th:replace="base :: mensajes"></div>

    <table class="table table-bordered table-hover">
        <thead class="thead-light">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Resumen</th>
            <th th:if="${session.usuario != null}">Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${lista}">
            <td th:text="${p.idPost}"></td>
            <td th:text="${p.title}"></td>
            <td th:text="|${p.user.firstname} ${p.user.lastname}|"></td>
            <td th:text="${p.summary}"></td>
            <td th:if="${session.usuario != null}">
                <span th:if="${p.published}" class="badge badge-success">Publicado</span>
                <span th:unless="${p.published}" class="badge badge-secondary">Borrador</span>
            </td>
            <td class="text-nowrap">
                <a th:href="@{/post/ver(id=${p.idPost})}" class="btn btn-sm btn-info">Ver</a>
                <th:block th:if="${session.usuario != null and (session.rol == 'admin' or p.user.idUser == session.usuario.idUser)}">
                    <a th:href="@{/post/edit(id=${p.idPost})}" class="btn btn-sm btn-primary">Editar</a>
                    <form th:action="@{/post/borrar}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Seguro que deseas borrar este post?');">
                        <input type="hidden" name="id" th:value="${p.idPost}">
                        <button type="submit" class="btn btn-sm btn-danger">Borrar</button>
                    </form>
                </th:block>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="6" class="text-center">No hay posts para mostrar</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

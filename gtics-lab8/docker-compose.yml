services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - ./Lab5_script.sql:/docker-entrypoint-initdb.d/Lab5_script.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/Lab5?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db_data:
